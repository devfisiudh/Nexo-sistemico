<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Administración | Nexo Sistémico</title>

    <link
        rel="stylesheet"
        href="./css/admin.css"
    >

    <link
        rel="stylesheet"
        href="./css/spa.css"
    >
</head>

<body class="admin-body">

    <!-- Primera carga: se oculta apenas se resuelve la sesión -->
    <div
        id="admin-loading"
        class="admin-loading"
    >
        Cargando panel...
    </div>


    <!-- ACCESO (solo visible sin sesión) -->

    <div
        id="auth-screen"
        class="login-page"
        hidden
    >

        <section class="login-card">

            <div class="login-header">
                <span class="login-label">
                    NEXO SISTÉMICO
                </span>

                <h1>Administración</h1>

                <p>
                    Acceso exclusivo para administradores
                    del portal.
                </p>
            </div>


            <form id="login-form">

                <div class="form-group">
                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <p
                    id="login-error"
                    class="login-error"
                    role="alert"
                    hidden
                ></p>


                <button
                    id="login-button"
                    type="submit"
                >
                    Iniciar sesión
                </button>

            </form>

        </section>

    </div>


    <!-- APLICACIÓN (una sola página, secciones por hash) -->

    <div
        id="admin-app"
        class="admin-layout"
        hidden
    >

        <aside class="admin-sidebar">

            <div class="sidebar-brand">
                <span class="sidebar-brand-small">
                    NEXO
                </span>

                <strong>
                    Administración
                </strong>
            </div>

            <nav
                class="sidebar-nav"
                aria-label="Secciones del panel"
            >

                <a
                    href="#/dashboard"
                    class="sidebar-link"
                >
                    Dashboard
                </a>

                <a
                    href="#/noticias"
                    class="sidebar-link"
                >
                    Noticias
                </a>

                <a
                    href="#/eventos"
                    class="sidebar-link"
                >
                    Eventos
                </a>

                <a
                    href="#/anuncios"
                    class="sidebar-link"
                >
                    Anuncios
                </a>

                <a
                    href="#/archivo"
                    class="sidebar-link"
                >
                    Archivo
                </a>

                <a
                    href="#/administradores"
                    id="menu-administradores"
                    class="sidebar-link"
                    hidden
                >
                    Administración
                </a>

            </nav>

            <div class="sidebar-footer">
                <a
                    href="/"
                    class="sidebar-public-link"
                >
                    Ver portal
                </a>
            </div>

        </aside>


        <div class="admin-main">

            <header class="admin-header">

                <div>
                    <h1 id="header-title">
                        Dashboard
                    </h1>

                    <p id="header-subtitle">
                        Panel de control
                    </p>
                </div>


                <div class="admin-user">

                    <div class="admin-user-info">
                        <strong id="admin-nombre">
                            Administrador
                        </strong>

                        <span id="admin-rol">
                            ...
                        </span>
                    </div>


                    <button
                        id="logout-button"
                        class="logout-button"
                        type="button"
                    >
                        Cerrar sesión
                    </button>

                </div>

            </header>


            <main
                id="admin-content"
                class="admin-content"
                tabindex="-1"
            ></main>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>
</html>
