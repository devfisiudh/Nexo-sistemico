<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Histórico | Nexo Sistémico UDH</title>
    <meta name="description" content="Histórico de noticias y eventos de la PAISI UDH: consulta las publicaciones archivadas y los eventos que ya pasaron.">
    <!-- noindex (arriba): es consulta interna, no contenido nuevo que posicionar -->

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nexo Sistémico UDH">
    <meta property="og:locale" content="es_PE">
    <meta property="og:title" content="Histórico | Nexo Sistémico UDH">
    <meta property="og:description" content="Histórico de noticias y eventos de la PAISI UDH: consulta las publicaciones archivadas y los eventos que ya pasaron.">
    <meta property="og:url" content="https://nexo-sistemico.vercel.app/historico">
    <meta property="og:image" content="https://nexo-sistemico.vercel.app/assets/img/compartir.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Nexo Sistémico UDH · PAISI">

    <meta name="twitter:card" content="summary_large_image">
    <link rel="shortcut icon" href="../assets/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/blog.css">
    <link rel="stylesheet" href="../css/historico.css">
</head>
<body>

    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div id="navbar-container"></div>

    <main id="contenido" class="container" style="padding: 40px 20px; min-height: 80vh;">
        <header class="page-header">
            <div class="page-header-inner">
                <span class="page-header-tag">PAISI · UDH</span>
                <h1 class="page-header-title">Histórico <span style="color:#E31C25">PAISI</span></h1>
                <p class="page-header-sub">
                    Lo que ya no aparece en las portadas activas: noticias
                    archivadas y eventos terminados.
                </p>
            </div>
        </header>

        <div class="historico-tabs" role="tablist" aria-label="Secciones del histórico">
            <button
                type="button"
                class="historico-tab activa"
                role="tab"
                id="tab-noticias"
                aria-controls="historico-lista"
                aria-selected="true"
                data-seccion="noticias"
            >Noticias</button>

            <button
                type="button"
                class="historico-tab"
                role="tab"
                id="tab-eventos"
                aria-controls="historico-lista"
                aria-selected="false"
                data-seccion="eventos"
            >Eventos</button>
        </div>

        <ol
            class="historico-lista"
            id="historico-lista"
            role="tabpanel"
            aria-labelledby="tab-noticias"
        >
            <li class="loader-simple historico-cargando">Cargando histórico...</li>
        </ol>

        <p class="historico-nota" id="historico-nota" hidden></p>
    </main>

    <div id="footer-container"></div>

    <!-- supabase-js debe estar cargado antes que cualquier módulo que lo importe -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>

    <script src="../js/main.js"></script>
    <script type="module" src="../js/historico.js"></script>
</body>
</html>
